<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column. Input first, verdict card and reasons below, technical details folded away. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --surface-2: #E8EEEC;
  --ink: #10211E;
  --muted: #465955;
  --line: #D3DCD9;
  --brand: #0B6B60;
  --brand-ink: #FFFFFF;
  --focus: #1F5FD0;
  --hi-bg: #FCE9E7; --hi-fg: #8C1A12; --hi-line: #B3261E;
  --md-bg: #FFF0D2; --md-fg: #6B4300; --md-line: #A8640A;
  --lo-bg: #E1F3E7; --lo-fg: #11502B; --lo-line: #1E7A43;
  --font-body: "IBM Plex Sans", "Noto Sans Tamil", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1413; --surface: #131E1C; --surface-2: #1B2927; --ink: #E4EEEB; --muted: #9DB2AD; --line: #2A3C39;
    --brand: #4FD1BF; --brand-ink: #05211D; --focus: #8AB4FF;
    --hi-bg: #3A1713; --hi-fg: #FFB4AB; --hi-line: #FF8A80;
    --md-bg: #3A2A0A; --md-fg: #F6C777; --md-line: #E2A33A;
    --lo-bg: #10301F; --lo-fg: #8EDDAA; --lo-line: #55C183;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1413; --surface: #131E1C; --surface-2: #1B2927; --ink: #E4EEEB; --muted: #9DB2AD; --line: #2A3C39;
  --brand: #4FD1BF; --brand-ink: #05211D; --focus: #8AB4FF;
  --hi-bg: #3A1713; --hi-fg: #FFB4AB; --hi-line: #FF8A80;
  --md-bg: #3A2A0A; --md-fg: #F6C777; --md-line: #E2A33A;
  --lo-bg: #10301F; --lo-fg: #8EDDAA; --lo-line: #55C183;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 17px; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 760px; margin-inline: auto; display: grid; gap: 16px; }
.app > * { min-width: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 40px; height: 40px; flex: none; color: var(--brand); }
.brand h1 { font-size: 1.55rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
.tagline { color: var(--muted); font-size: 0.92rem; }
.lang { display: inline-flex; border: 2px solid var(--brand); border-radius: 999px; overflow: hidden; }
.lang button { border: 0; background: transparent; color: var(--brand); padding: 7px 16px; font-weight: 600; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.privacy { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); font-size: 0.92rem; margin-bottom: 14px; }
.privacy svg { flex: none; width: 20px; height: 20px; color: var(--brand); margin-top: 2px; }

.drop { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 28px 14px; border: 2px dashed var(--muted); border-radius: 12px; background: var(--surface-2); cursor: pointer; overflow-wrap: anywhere; }
.drop:hover, .drop.over { border-color: var(--brand); }
.drop:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.drop svg { width: 34px; height: 34px; color: var(--brand); }
.drop strong { font-size: 1.05rem; }
.drop small { color: var(--muted); font-size: 0.85rem; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.samples { margin-top: 16px; display: grid; gap: 8px; }
.samples > span { color: var(--muted); font-size: 0.88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
.chip:hover { border-color: var(--brand); }
.chip:disabled { opacity: 0.55; cursor: progress; }

.status { margin-top: 12px; min-height: 1.5em; color: var(--muted); font-size: 0.92rem; }
.status.error { color: var(--hi-fg); background: var(--hi-bg); border: 1px solid var(--hi-line); border-radius: 10px; padding: 10px 12px; font-weight: 600; }

.result { display: grid; gap: 16px; }
.result > * { min-width: 0; }
.example-chip { justify-self: start; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 0.82rem; }
.verdict { border: 2px solid; border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
.verdict.high { background: var(--hi-bg); color: var(--hi-fg); border-color: var(--hi-line); }
.verdict.medium { background: var(--md-bg); color: var(--md-fg); border-color: var(--md-line); }
.verdict.low { background: var(--lo-bg); color: var(--lo-fg); border-color: var(--lo-line); }
.verdict-head { display: flex; gap: 12px; align-items: center; }
.verdict-head svg { width: 44px; height: 44px; flex: none; }
.verdict h2 { font-size: 1.7rem; line-height: 1.15; font-weight: 700; outline: none; }
.scoreline { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.scoreline b { font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.meter { height: 12px; border-radius: 999px; background: color-mix(in srgb, currentColor 18%, transparent); overflow: hidden; }
.meter i { display: block; height: 100%; background: currentColor; border-radius: inherit; }
.appline { font-size: 0.92rem; overflow-wrap: anywhere; }
.appline code { font-family: var(--font-mono); font-size: 0.85em; }

.card h3 { font-size: 1.05rem; margin-bottom: 10px; }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.reasons li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.sev { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; border: 1.5px solid; margin-top: 2px; white-space: nowrap; }
.sev.high { color: var(--hi-fg); background: var(--hi-bg); border-color: var(--hi-line); }
.sev.medium { color: var(--md-fg); background: var(--md-bg); border-color: var(--md-line); }
.sev.low { color: var(--lo-fg); background: var(--lo-bg); border-color: var(--lo-line); }

.help { border: 2px solid var(--hi-line); background: var(--surface); display: grid; gap: 10px; }
.help .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.helpline { font-weight: 700; font-size: 1.2rem; background: var(--hi-bg); color: var(--hi-fg); border-radius: 8px; padding: 6px 14px; user-select: all; }
.linkbtn { display: inline-block; padding: 8px 14px; border: 2px solid var(--hi-line); border-radius: 10px; color: var(--hi-fg); font-weight: 600; text-decoration: none; }

details.tech summary { cursor: pointer; font-weight: 600; }
.tech dl { display: grid; gap: 12px; margin: 14px 0 0; }
.tech dt { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
.tech dd { margin: 2px 0 0; font-family: var(--font-mono); font-size: 0.8rem; overflow-wrap: anywhere; }
.tech .perms { max-height: 220px; overflow: auto; margin: 0; padding-left: 18px; }
.tech .note { font-family: var(--font-body); color: var(--muted); font-size: 0.85rem; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 180px; padding: 12px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; border: 2px solid var(--brand); background: var(--surface); color: var(--brand); }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.fallback { width: 100%; min-height: 6em; font-family: var(--font-mono); font-size: 0.8rem; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.foot { color: var(--muted); font-size: 0.82rem; }

@media (prefers-reduced-motion: no-preference) { .meter i { transition: width 0.5s ease; } }
@media (max-width: 480px) { html { font-size: 16px; } .verdict h2 { font-size: 1.45rem; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 6 8.5v10.2c0 9.2 5.7 15.6 14 18.3 8.3-2.700 14-9.100 14-18.300V8.500L20 3z" fill="currentColor"/><path d="m13.500 20.500 4.800 4.800 8.600-9.600" fill="none" stroke="var(--bg)" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>APK Shield</h1><p class="tagline" data-i18n="tagline"></p></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en">English</button>
      <button type="button" id="lang-ta">தமிழ்</button>
    </div>
  </header>

  <section class="card" aria-labelledby="intake-title">
    <h2 id="intake-title" class="vh" data-i18n="drop_title"></h2>
    <p class="privacy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span data-i18n="privacy"></span>
    </p>
    <label class="drop" id="drop" for="file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8.500 12 3 3 8.500v7L12 21l9-5.500z"/><path d="M3 8.500 12 14l9-5.500M12 14v7"/></svg>
      <strong data-i18n="drop_title"></strong>
      <small data-i18n="drop_hint"></small>
      <span class="vh" id="file-name"></span>
    </label>
    <input type="file" id="file" class="vh" accept=".apk,application/vnd.android.package-archive">
    <div class="samples">
      <span data-i18n="samples_label"></span>
      <div class="chips">
        <button type="button" class="chip" data-sample="rto" data-i18n="sample_rto"></button>
        <button type="button" class="chip" data-sample="sms" data-i18n="sample_sms"></button>
        <button type="button" class="chip" data-sample="notes" data-i18n="sample_notes"></button>
      </div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section class="result" id="result" hidden>
    <p class="example-chip" id="example-chip" hidden data-i18n="example_chip"></p>
    <div class="verdict" id="verdict">
      <div class="verdict-head">
        <span id="verdict-icon"></span>
        <h2 id="verdict-text" tabindex="-1"></h2>
      </div>
      <div class="scoreline"><span data-i18n="score"></span><b id="score"></b><span>/100</span></div>
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <p id="summary"></p>
      <p class="appline" id="appline"></p>
    </div>

    <div class="card">
      <h3 data-i18n="why"></h3>
      <ul class="reasons" id="reasons"></ul>
    </div>

    <div class="card help" id="help" hidden>
      <h3 data-i18n="help_title"></h3>
      <p data-i18n="help_body"></p>
      <div class="row">
        <span class="helpline" data-i18n="helpline"></span>
        <a class="linkbtn" href="https://cybercrime.gov.in" target="_blank" rel="noopener noreferrer">cybercrime.gov.in</a>
      </div>
    </div>

    <details class="card tech">
      <summary data-i18n="tech"></summary>
      <dl id="tech"></dl>
    </details>

    <div class="actions">
      <button type="button" class="btn primary" id="copy" data-i18n="copy"></button>
      <button type="button" class="btn" id="again" data-i18n="again"></button>
    </div>
    <div id="fallback-wrap" hidden><textarea class="fallback" id="fallback" readonly aria-label="Result text"></textarea></div>
  </section>

  <p class="foot" data-i18n="footer"></p>
</main>

    for (const c of certs) {
      const fp = await sha256(c);
      if (!seen.has(fp)) seen.set(fp, subjectOf(c));
    }
    return { fingerprints: [...seen.keys()], subjects: [...seen.values()], schemes };
  }

  /* ================= risk engine (same rules as the server version) ================= */
  const PERM_RULES = {
    "android.permission.READ_SMS": ["sms_read", 30], "android.permission.RECEIVE_SMS": ["sms_read", 30],
    "android.permission.SEND_SMS": ["sms_send", 12],
    "android.permission.BIND_ACCESSIBILITY_SERVICE": ["accessibility", 30],
    "android.permission.SYSTEM_ALERT_WINDOW": ["overlay", 15],
    "android.permission.BIND_NOTIFICATION_LISTENER_SERVICE": ["notif_listener", 20],
    "android.permission.BIND_DEVICE_ADMIN": ["device_admin", 15],
    "android.permission.REQUEST_INSTALL_PACKAGES": ["install_packages", 10],
    "android.permission.READ_CONTACTS": ["contacts", 8],
  };
  const COMBOS = [
    [["sms_read", "accessibility"], 25, "combo_sms_accessibility"],
    [["sms_read", "overlay"], 20, "combo_sms_overlay"],
    [["accessibility", "overlay"], 10, "combo_accessibility_overlay"],
    [["sms_read", "notif_listener"], 15, "combo_sms_notification"],
  ];
  const SCAM_WORDS = ["rto", "challan", "echallan", "e-challan", "kyc", "pm kisan", "pmkisan", "aadhaar update", "bank update", "free recharge", "lottery", "reward points"];
  /* Real fingerprints go in `certs`. Empty means the brand can be recognised but not verified. */
  const TRUSTED = [
    { brand: "YONO SBI", pkg: "com.sbi.lotusintouch", certs: [], kw: ["sbi", "yono", "state bank"] },
    { brand: "PhonePe", pkg: "com.phonepe.app", certs: [], kw: ["phonepe"] },
    { brand: "Google Pay", pkg: "com.google.android.apps.nbu.paisa.user", certs: [], kw: ["gpay", "google pay", "tez"] },
    { brand: "Paytm", pkg: "net.one97.paytm", certs: [], kw: ["paytm"] },
    { brand: "mParivahan", pkg: "com.nic.mparivahan", certs: [], kw: ["parivahan", "vahan"] },
    { brand: "UMANG", pkg: "in.gov.umang.negd.g2c", certs: [], kw: ["umang"] },
    { brand: "HDFC Bank", pkg: "com.snapwork.hdfc", certs: [], kw: ["hdfc"] },
    { brand: "iMobile Pay (ICICI)", pkg: "com.csam.icici.bank.imobile", certs: [], kw: ["icici", "imobile"] },
    { brand: "BHIM", pkg: "in.org.npci.upiapp", certs: [], kw: ["bhim"] },
    { brand: "DigiLocker", pkg: "com.digilocker.android", certs: [], kw: ["digilocker"] },
    { brand: "mAadhaar", pkg: "in.gov.uidai.mAadhaarPlus", certs: [], kw: ["aadhaar", "maadhaar"] },
  ];
  const tokens = (s) => new Set((String(s || "").toLowerCase().match(/[a-z0-9]+/g)) || []);
  function similarity(a, b) {
    a = a.slice(0, 120); b = b.slice(0, 120);
    if (!a || !b) return 0;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return 1 - prev[b.length] / Math.max(a.length, b.length);
  }
  function looksLikeBrand(info, brand) {
    const label = (info.label || "").toLowerCase(), lt = tokens(label), pt = tokens(info.package);
    for (const k of brand.kw) {
      if (k.includes(" ") ? label.includes(k) : (lt.has(k) || pt.has(k))) return true;
    }
    return similarity(label, brand.brand.toLowerCase()) >= 0.85;
  }
  function brandCheck(info) {
    const found = new Set(info.fingerprints);
    for (const b of TRUSTED) {
      const same = info.package === b.pkg;
      if (!same && !looksLikeBrand(info, b)) continue;
      if (same && b.certs.length) return b.certs.some((c) => found.has(c)) ? ["verified", b.brand, 0] : ["impersonation", b.brand, 60];
      if (same) return ["unverified", b.brand, 20];
      return ["impersonation", b.brand, 45];
    }
    return [null, null, 0];
  }
  function assess(info) {
    let reasons = [];
    const add = (key, weight, params) => reasons.push({ key, weight, params: params || {} });
    const triggered = {};
    for (const p of [...new Set(info.permissions)].sort()) {
      const r = PERM_RULES[p];
      if (r && !(r[0] in triggered)) triggered[r[0]] = r[1];
    }
    for (const k in triggered) add(k, triggered[k]);
    for (const [keys, bonus, key] of COMBOS) if (keys.every((k) => k in triggered)) add(key, bonus);
    const [status, brand, w] = brandCheck(info);
    if (status === "impersonation") add("impersonation", w, { brand });
    else if (status === "unverified") add("brand_unverified", w, { brand });
    if (status !== "verified") {
      const label = (info.label || "").toLowerCase(), lt = tokens(label);
      if (SCAM_WORDS.some((k) => (k.includes(" ") || k.includes("-") ? label.includes(k) : lt.has(k)))) add("scam_keyword", 20);
    }
    if (!info.fingerprints.length) add("unsigned", 15);
    if (info.debugSigned) add("debug_signed", 15);
    let score = Math.min(100, reasons.reduce((s, r) => s + r.weight, 0));
    if (status === "verified") { score = Math.min(score, 10); reasons = [{ key: "verified_publisher", weight: 0, params: { brand } }]; }
    const level = score >= 60 ? "HIGH" : score >= 30 ? "MEDIUM" : "LOW";
    reasons.sort((a, b) => b.weight - a.weight);
    return { score, level, reasons };
  }

  /* ================= analysing a file ================= */
  async function analyzeFile(file) {
    if (file.size > MAX_APK) throw new AppError("too_large");
    const zip = await openZip(file);
    const manifestBytes = await extract(zip, "AndroidManifest.xml", 24 * MB);
    if (!manifestBytes) throw new AppError("not_apk");
    const m = parseManifest(manifestBytes);
    if (!m.package) throw new AppError("analysis_failed");
    let label = typeof m.label === "string" ? m.label : null;
    if (label === null && m.label && m.label.ref) {
      try {
        const arsc = await extract(zip, "resources.arsc", 96 * MB);
        if (arsc) label = resolveString(arsc, m.label.ref);
      } catch (err) { label = null; }
    }
    const cert = await readCertificates(zip);
    return {
      package: m.package, version: m.versionName, label: label || m.package,
      permissions: [...m.permissions].sort(),
      fingerprints: cert.fingerprints, subjects: cert.subjects, schemes: cert.schemes,
      debugSigned: cert.subjects.some((s) => s.cn === "Android Debug"),
    };
  }

  /* ================= example data (clearly marked in the page) ================= */
  const EXAMPLES = {
    rto: { package: "com.rto.challan.pay", version: "1.0.3", label: "RTO Challan Pay",
      permissions: ["android.permission.READ_SMS", "android.permission.RECEIVE_SMS", "android.permission.SYSTEM_ALERT_WINDOW", "android.permission.BIND_ACCESSIBILITY_SERVICE", "android.permission.REQUEST_INSTALL_PACKAGES", "android.permission.INTERNET"],
      fingerprints: ["9F1C3A5D7E2B40C8A6D1F0E3B2C49A87D5E6F1203B4C8A9D7E6F5A4B3C2D1E0F"], subjects: [{ cn: "Android Debug", org: "Android" }], schemes: ["v1"], debugSigned: true },
    sms: { package: "com.example.smsbackup", version: "2.4", label: "SMS Backup Tool",
      permissions: ["android.permission.READ_SMS", "android.permission.INTERNET"],
      fingerprints: ["4A7B0C9D1E2F3A4B5C6D7E8F9A0B1C2D3E4F5A6B7C8D9E0F1A2B3C4D5E6F7A8B"], subjects: [{ cn: "Example Apps", org: "Example Ltd" }], schemes: ["v2"], debugSigned: false },
    notes: { package: "com.example.quicknotes", version: "5.1.0", label: "Quick Notes",
      permissions: ["android.permission.INTERNET"],
      fingerprints: ["C0FFEE1234567890ABCDEF1234567890ABCDEF1234567890ABCDEF1234567890"], subjects: [{ cn: "Quick Notes", org: "Example Ltd" }], schemes: ["v2", "v3"], debugSigned: false },
  };

  /* ================= screen ================= */
  const ICON = {
    HIGH: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>',
    MEDIUM: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.300 3.900 1.800 18a2 2 0 0 0 1.700 3h17a2 2 0 0 0 1.700-3L13.700 3.900a2 2 0 0 0-3.400 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
    LOW: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8 12.500 3 3 5-6"/></svg>',
  };
  let lang = "en", current = null, statusKey = null, errorCode = null;
  try { const saved = localStorage.getItem("apkshield_lang"); if (saved === "ta" || saved === "en") lang = saved; else if ((navigator.language || "").toLowerCase().startsWith("ta")) lang = "ta"; } catch (e) { /* storage unavailable */ }

  const t = (k) => UI[lang][k] || UI.en[k] || k;
  const pick = (o) => o[lang] || o.en;
  const fill = (o, params) => pick(o).replace(/\{(\w+)\}/g, (_, k) => params[k] || "");
  const severity = (w) => (w >= 25 ? "high" : w >= 12 ? "medium" : "low");
  const colonHex = (h) => h.match(/.{2}/g).join(":");
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };

  function renderStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
    $("lang-en").setAttribute("aria-pressed", String(lang === "en"));
    $("lang-ta").setAttribute("aria-pressed", String(lang === "ta"));
    renderStatus();
    if (current) renderResult(false);
  }
  function renderStatus() {
    const s = $("status");
    s.className = "status" + (errorCode ? " error" : "");
    s.textContent = errorCode ? pick(ERR[errorCode]) : statusKey ? t(statusKey) : "";
  }
  function setBusy(busy) {
    $("file").disabled = busy;
    document.querySelectorAll(".chip").forEach((b) => { b.disabled = busy; });
  }

  function renderResult(focus) {
    const { info, res, example } = current;
    $("result").hidden = false;
    $("example-chip").hidden = !example;
    const v = $("verdict");
    v.className = "verdict " + res.level.toLowerCase();
    $("verdict-icon").innerHTML = ICON[res.level];
    $("verdict-text").textContent = pick(VERDICT[res.level]);
    $("score").textContent = String(res.score);
    $("meter").style.width = Math.max(3, res.score) + "%";
    $("summary").textContent = pick(SUMMARY[res.level]);
    const line = $("appline");
    line.textContent = "";
    line.append(t("app_label") + ": " + info.label + " (");
    line.append(el("code", "", info.package));
    line.append(")");

    const ul = $("reasons");
    ul.textContent = "";
    if (!res.reasons.length) ul.append(el("li", "", t("no_reasons")));
    for (const r of res.reasons) {
      const li = document.createElement("li");
      const sev = severity(r.weight);
      li.append(el("span", "sev " + sev, t("sev_" + sev)), el("span", "", fill(REASON[r.key], r.params)));
      ul.append(li);
    }
    $("help").hidden = res.level !== "HIGH";

    const dl = $("tech");
    dl.textContent = "";
    const row = (label, node) => { const d = document.createElement("div"); d.append(el("dt", "", label)); const dd = el("dd"); dd.append(node); d.append(dd); dl.append(d); };
    const text = (s) => document.createTextNode(s || t("unknown"));
    const list = (items) => { if (!items.length) return text(t("none")); const u = el("ul", "perms"); items.forEach((i) => u.append(el("li", "", i))); return u; };
    row(t("app_name"), text(info.label));
    row(t("package"), text(info.package));
    row(t("version"), text(info.version));
    row(t("signer"), list(info.subjects.map((s) => [s.cn, s.org].filter(Boolean).join(", ") || t("unknown"))));
    row(t("cert"), list(info.fingerprints.map(colonHex)));
    const sch = el("span"); sch.append(info.schemes.length ? info.schemes.join(", ") : t("none")); sch.append(el("div", "note", t("scheme_note")));
    row(t("schemes"), sch);
    row(t("perms"), list(info.permissions));

    $("fallback-wrap").hidden = true;
    $("copy").textContent = t("copy");
    if (focus) {
      const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      $("verdict").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
      $("verdict-text").focus({ preventScroll: true });
    }
  }

  function resultText() {
    const { info, res } = current;
    return [`APK Shield: ${pick(VERDICT[res.level])} (${res.score}/100)`, `${info.label} (${info.package})`, ...res.reasons.slice(0, 4).map((r) => "- " + fill(REASON[r.key], r.params))].join("\n");
  }

  async function handleFile(file) {
    if (!file) return;
    errorCode = null; statusKey = "reading"; renderStatus(); setBusy(true);
    $("file-name").textContent = file.name;
    try {
      const info = await analyzeFile(file);
      current = { info, res: assess(info), example: false };
      statusKey = null; renderStatus(); renderResult(true);
    } catch (err) {
      statusKey = null;
      errorCode = err instanceof AppError && ERR[err.code] ? err.code : "analysis_failed";
      renderStatus();
    } finally { setBusy(false); $("file").value = ""; }
  }

  /* ================= wiring ================= */
  $("lang-en").addEventListener("click", () => { lang = "en"; try { localStorage.setItem("apkshield_lang", lang); } catch (e) { /* ignore */ } renderStatic(); });
  $("lang-ta").addEventListener("click", () => { lang = "ta"; try { localStorage.setItem("apkshield_lang", lang); } catch (e) { /* ignore */ } renderStatic(); });
  $("file").addEventListener("change", (e) => handleFile(e.target.files[0]));
  document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => {
    errorCode = null; statusKey = null; renderStatus();
    const info = EXAMPLES[b.dataset.sample];
    current = { info, res: assess(info), example: true };
    renderResult(true);
  }));
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => handleFile(e.dataTransfer.files[0]));
  $("again").addEventListener("click", () => {
    current = null; $("result").hidden = true; errorCode = null; statusKey = null; renderStatus();
    window.scrollTo({ top: 0 }); $("file").focus();
  });
  $("copy").addEventListener("click", async () => {
    const text = resultText();
    try { await navigator.clipboard.writeText(text); $("copy").textContent = t("copied"); setTimeout(() => { if (current) $("copy").textContent = t("copy"); }, 1800); }
    catch (err) { const box = $("fallback"); box.value = text; $("fallback-wrap").hidden = false; box.focus(); box.select(); }
  });

  renderStatic();
})();
</script>
</body>
</html>
