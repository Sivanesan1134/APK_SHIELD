<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column. Input first, verdict card and reasons below, technical details folded away. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --surface-2: #E8EEEC;
  --ink: #10211E;
  --muted: #465955;
  --line: #D3DCD9;
  --brand: #0B6B60;
  --brand-ink: #FFFFFF;
  --focus: #1F5FD0;
  --hi-bg: #FCE9E7; --hi-fg: #8C1A12; --hi-line: #B3261E;
  --md-bg: #FFF0D2; --md-fg: #6B4300; --md-line: #A8640A;
  --lo-bg: #E1F3E7; --lo-fg: #11502B; --lo-line: #1E7A43;
  --font-body: "IBM Plex Sans", "Noto Sans Tamil", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1413; --surface: #131E1C; --surface-2: #1B2927; --ink: #E4EEEB; --muted: #9DB2AD; --line: #2A3C39;
    --brand: #4FD1BF; --brand-ink: #05211D; --focus: #8AB4FF;
    --hi-bg: #3A1713; --hi-fg: #FFB4AB; --hi-line: #FF8A80;
    --md-bg: #3A2A0A; --md-fg: #F6C777; --md-line: #E2A33A;
    --lo-bg: #10301F; --lo-fg: #8EDDAA; --lo-line: #55C183;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1413; --surface: #131E1C; --surface-2: #1B2927; --ink: #E4EEEB; --muted: #9DB2AD; --line: #2A3C39;
  --brand: #4FD1BF; --brand-ink: #05211D; --focus: #8AB4FF;
  --hi-bg: #3A1713; --hi-fg: #FFB4AB; --hi-line: #FF8A80;
  --md-bg: #3A2A0A; --md-fg: #F6C777; --md-line: #E2A33A;
  --lo-bg: #10301F; --lo-fg: #8EDDAA; --lo-line: #55C183;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { font-size: 17px; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 760px; margin-inline: auto; display: grid; gap: 16px; }
.app > * { min-width: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 40px; height: 40px; flex: none; color: var(--brand); }
.brand h1 { font-size: 1.55rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.01em; }
.tagline { color: var(--muted); font-size: 0.92rem; }
.lang { display: inline-flex; border: 2px solid var(--brand); border-radius: 999px; overflow: hidden; }
.lang button { border: 0; background: transparent; color: var(--brand); padding: 7px 16px; font-weight: 600; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.privacy { display: flex; gap: 10px; align-items: flex-start; color: var(--muted); font-size: 0.92rem; margin-bottom: 14px; }
.privacy svg { flex: none; width: 20px; height: 20px; color: var(--brand); margin-top: 2px; }

.drop { display: grid; gap: 4px; justify-items: center; text-align: center; padding: 28px 14px; border: 2px dashed var(--muted); border-radius: 12px; background: var(--surface-2); cursor: pointer; overflow-wrap: anywhere; }
.drop:hover, .drop.over { border-color: var(--brand); }
.drop:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.drop svg { width: 34px; height: 34px; color: var(--brand); }
.drop strong { font-size: 1.05rem; }
.drop small { color: var(--muted); font-size: 0.85rem; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.samples { margin-top: 16px; display: grid; gap: 8px; }
.samples > span { color: var(--muted); font-size: 0.88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
.chip:hover { border-color: var(--brand); }
.chip:disabled { opacity: 0.55; cursor: progress; }

.status { margin-top: 12px; min-height: 1.5em; color: var(--muted); font-size: 0.92rem; }
.status.error { color: var(--hi-fg); background: var(--hi-bg); border: 1px solid var(--hi-line); border-radius: 10px; padding: 10px 12px; font-weight: 600; }

.result { display: grid; gap: 16px; }
.result > * { min-width: 0; }
.example-chip { justify-self: start; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 0.82rem; }
.verdict { border: 2px solid; border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
.verdict.high { background: var(--hi-bg); color: var(--hi-fg); border-color: var(--hi-line); }
.verdict.medium { background: var(--md-bg); color: var(--md-fg); border-color: var(--md-line); }
.verdict.low { background: var(--lo-bg); color: var(--lo-fg); border-color: var(--lo-line); }
.verdict-head { display: flex; gap: 12px; align-items: center; }
.verdict-head svg { width: 44px; height: 44px; flex: none; }
.verdict h2 { font-size: 1.7rem; line-height: 1.15; font-weight: 700; outline: none; }
.scoreline { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.scoreline b { font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.meter { height: 12px; border-radius: 999px; background: color-mix(in srgb, currentColor 18%, transparent); overflow: hidden; }
.meter i { display: block; height: 100%; background: currentColor; border-radius: inherit; }
.appline { font-size: 0.92rem; overflow-wrap: anywhere; }
.appline code { font-family: var(--font-mono); font-size: 0.85em; }

.card h3 { font-size: 1.05rem; margin-bottom: 10px; }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.reasons li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.sev { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; border: 1.5px solid; margin-top: 2px; white-space: nowrap; }
.sev.high { color: var(--hi-fg); background: var(--hi-bg); border-color: var(--hi-line); }
.sev.medium { color: var(--md-fg); background: var(--md-bg); border-color: var(--md-line); }
.sev.low { color: var(--lo-fg); background: var(--lo-bg); border-color: var(--lo-line); }

.help { border: 2px solid var(--hi-line); background: var(--surface); display: grid; gap: 10px; }
.help .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.helpline { font-weight: 700; font-size: 1.2rem; background: var(--hi-bg); color: var(--hi-fg); border-radius: 8px; padding: 6px 14px; user-select: all; }
.linkbtn { display: inline-block; padding: 8px 14px; border: 2px solid var(--hi-line); border-radius: 10px; color: var(--hi-fg); font-weight: 600; text-decoration: none; }

.threats { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.threat { background: var(--surface-2); border-radius: 10px; padding: 12px; display: grid; gap: 6px; }
.threat-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.threat-head b { font-size: 1rem; }
.threat p { margin: 0; }
.threat .lbl { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.threat .like { color: var(--muted); font-size: 0.9rem; }
.threats-note { color: var(--muted); font-size: 0.88rem; margin: 10px 0 0; }
.disclaimer { background: var(--hi-bg); border: 2px solid var(--hi-line); color: var(--hi-fg); display: grid; gap: 6px; }
.disclaimer h3 { margin: 0; }
.disclaimer p { margin: 0; font-weight: 500; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { flex: 1 1 200px; padding: 11px 14px; border-radius: 10px; border: 2px solid var(--brand); background: var(--surface); color: var(--brand); font-weight: 600; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--brand); color: var(--brand-ink); }
.pane { display: grid; gap: 16px; }
.pane > * { min-width: 0; }
.lbl-big { font-weight: 600; display: block; margin-bottom: 8px; }
.msgbox { width: 100%; min-height: 8.5em; resize: vertical; font: inherit; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.msgbox:focus-visible { border-color: var(--brand); }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.linkrow { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.linkrow code { font-family: var(--font-mono); font-size: 0.88em; overflow-wrap: anywhere; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.voice-note { color: var(--muted); font-size: 0.88rem; }
.alarm { background: #3B0A07; color: #fff; border: 3px solid #fff; border-radius: 14px; padding: 16px 18px; display: grid; gap: 4px; }
.alarm h2 { font-size: 1.45rem; letter-spacing: 0.01em; }
.alarm p { font-weight: 500; }
html[data-alert="high"] body { background: #B3261E; }
html[data-alert="high"] .top, html[data-alert="high"] .foot, html[data-alert="high"] .tagline { color: #fff; }
html[data-alert="high"] .brand .mark { color: #fff; }
html[data-alert="high"] .lang { border-color: #fff; }
html[data-alert="high"] .lang button { color: #fff; }
html[data-alert="high"] .lang button[aria-pressed="true"] { background: #fff; color: #8C1A12; }
html[data-alert="high"] .tab { border-color: #fff; background: transparent; color: #fff; }
html[data-alert="high"] .tab[aria-selected="true"] { background: #fff; color: #8C1A12; }
@media (prefers-color-scheme: dark) { html[data-alert="high"]:not([data-theme="light"]) body { background: #6E0F0A; } }
html[data-alert="high"][data-theme="dark"] body { background: #6E0F0A; }
.second { display: grid; gap: 10px; }
.second .linkbtn { justify-self: start; border-color: var(--brand); color: var(--brand); }
details.tech summary { cursor: pointer; font-weight: 600; }
.tech dl { display: grid; gap: 12px; margin: 14px 0 0; }
.tech dt { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
.tech dd { margin: 2px 0 0; font-family: var(--font-mono); font-size: 0.8rem; overflow-wrap: anywhere; }
.tech .perms { max-height: 220px; overflow: auto; margin: 0; padding-left: 18px; }
.tech .note { font-family: var(--font-body); color: var(--muted); font-size: 0.85rem; }

.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { flex: 1 1 180px; padding: 12px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; border: 2px solid var(--brand); background: var(--surface); color: var(--brand); }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.fallback { width: 100%; min-height: 6em; font-family: var(--font-mono); font-size: 0.8rem; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.foot { color: var(--muted); font-size: 0.82rem; }

@media (prefers-reduced-motion: no-preference) { .meter i { transition: width 0.5s ease; } }
@media (max-width: 480px) { html { font-size: 16px; } .verdict h2 { font-size: 1.45rem; } }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 6 8.5v10.2c0 9.2 5.7 15.6 14 18.3 8.3-2.700 14-9.100 14-18.300V8.500L20 3z" fill="currentColor"/><path d="m13.500 20.500 4.800 4.800 8.600-9.600" fill="none" stroke="var(--bg)" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>APK Shield</h1><p class="tagline" data-i18n="tagline"></p></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-en">English</button>
      <button type="button" id="lang-ta">தமிழ்</button>
    </div>
  </header>

  <div class="alarm" id="alarm" role="alert" hidden>
    <h2 data-i18n="alarm_title"></h2>
    <p id="alarm-body"></p>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" id="tab-apk" aria-controls="pane-apk" aria-selected="true" data-i18n="tab_apk"></button>
    <button type="button" class="tab" role="tab" id="tab-msg" aria-controls="pane-msg" aria-selected="false" data-i18n="tab_msg"></button>
  </div>

  <div class="pane" id="pane-apk" role="tabpanel" aria-labelledby="tab-apk">
  <section class="card" aria-labelledby="intake-title">
    <h2 id="intake-title" class="vh" data-i18n="drop_title"></h2>
    <p class="privacy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span data-i18n="privacy"></span>
    </p>
    <label class="drop" id="drop" for="file">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8.500 12 3 3 8.500v7L12 21l9-5.500z"/><path d="M3 8.500 12 14l9-5.500M12 14v7"/></svg>
      <strong data-i18n="drop_title"></strong>
      <small data-i18n="drop_hint"></small>
      <span class="vh" id="file-name"></span>
    </label>
    <input type="file" id="file" class="vh" accept=".apk,application/vnd.android.package-archive">
    <div class="samples">
      <span data-i18n="samples_label"></span>
      <div class="chips">
        <button type="button" class="chip" data-sample="rto" data-i18n="sample_rto"></button>
        <button type="button" class="chip" data-sample="sms" data-i18n="sample_sms"></button>
        <button type="button" class="chip" data-sample="notes" data-i18n="sample_notes"></button>
      </div>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </section>

  <section class="result" id="result" hidden>
    <p class="example-chip" id="example-chip" hidden data-i18n="example_chip"></p>
    <div class="verdict" id="verdict">
      <div class="verdict-head">
        <span id="verdict-icon"></span>
        <h2 id="verdict-text" tabindex="-1"></h2>
      </div>
      <div class="scoreline"><span data-i18n="score"></span><b id="score"></b><span>/100</span></div>
      <div class="meter" aria-hidden="true"><i id="meter"></i></div>
      <p id="summary"></p>
      <p class="appline" id="appline"></p>
    </div>

    <div class="card">
      <h3 data-i18n="why"></h3>
      <ul class="reasons" id="reasons"></ul>
    </div>

    <div class="card" id="threats-card">
      <h3 data-i18n="th_title"></h3>
      <ul class="threats" id="threats"></ul>
      <p class="threats-note" data-i18n="th_note"></p>
    </div>

    <div class="card disclaimer" id="disclaimer" role="note">
      <h3 data-i18n="disc_title"></h3>
      <p data-i18n="disc_body"></p>
    </div>

    <div class="card help" id="help" hidden>
      <h3 data-i18n="help_title"></h3>
      <p data-i18n="help_body"></p>
      <div class="row">
        <span class="helpline" data-i18n="helpline"></span>
        <a class="linkbtn" href="https://cybercrime.gov.in" target="_blank" rel="noopener noreferrer">cybercrime.gov.in</a>
      </div>
    </div>

    <div class="card second" id="second" hidden>
      <h3 data-i18n="so_title"></h3>
      <p data-i18n="so_body"></p>
      <a class="linkbtn" id="vt" href="#" target="_blank" rel="noopener noreferrer" data-i18n="so_button"></a>
    </div>

    <details class="card tech">
      <summary data-i18n="tech"></summary>
      <dl id="tech"></dl>
    </details>

    <div class="actions">
      <button type="button" class="btn primary" id="copy" data-i18n="copy"></button>
      <button type="button" class="btn" id="speak"></button>
      <button type="button" class="btn" id="again" data-i18n="again"></button>
    </div>
    <p class="voice-note" id="speak-note" hidden></p>
    <div id="fallback-wrap" hidden><textarea class="fallback" id="fallback" readonly aria-label="Result text"></textarea></div>
  </section>
  </div>

  <div class="pane" id="pane-msg" role="tabpanel" aria-labelledby="tab-msg" hidden>
    <section class="card">
      <p class="privacy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span data-i18n="msg_privacy"></span>
      </p>
      <label class="lbl-big" for="msg-input" data-i18n="msg_label"></label>
      <textarea class="msgbox" id="msg-input" rows="6" maxlength="5000" data-i18n-ph="msg_ph"></textarea>
      <div class="row-actions">
        <button type="button" class="btn primary" id="msg-check" data-i18n="msg_check"></button>
        <button type="button" class="btn" id="msg-clear" data-i18n="msg_clear"></button>
      </div>
      <div class="samples">
        <span data-i18n="msg_samples"></span>
        <div class="chips">
          <button type="button" class="chip" data-msample="rto" data-i18n="ms_rto"></button>
          <button type="button" class="chip" data-msample="kyc" data-i18n="ms_kyc"></button>
          <button type="button" class="chip" data-msample="ok" data-i18n="ms_ok"></button>
        </div>
      </div>
      <p class="status error" id="msg-status" hidden></p>
    </section>

    <section class="result" id="msg-result" hidden>
      <p class="example-chip" id="m-example-chip" hidden data-i18n="example_chip"></p>
      <div class="verdict" id="m-verdict">
        <div class="verdict-head">
          <span id="m-verdict-icon"></span>
          <h2 id="m-verdict-text" tabindex="-1"></h2>
        </div>
        <div class="scoreline"><span data-i18n="score"></span><b id="m-score"></b><span>/100</span></div>
        <div class="meter" aria-hidden="true"><i id="m-meter"></i></div>
        <p id="m-summary"></p>
      </div>
      <div class="card">
        <h3 data-i18n="why"></h3>
        <ul class="reasons" id="m-reasons"></ul>
      </div>
      <div class="card">
        <h3 data-i18n="links_title"></h3>
        <ul class="threats" id="m-links"></ul>
        <p class="threats-note" data-i18n="links_note"></p>
      </div>
      <div class="card help" id="m-help" hidden>
        <h3 data-i18n="m_help_title"></h3>
        <p data-i18n="m_help_body"></p>
        <div class="row">
          <span class="helpline" data-i18n="helpline"></span>
          <a class="linkbtn" href="https://cybercrime.gov.in" target="_blank" rel="noopener noreferrer">cybercrime.gov.in</a>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="btn" id="m-speak"></button>
        <button type="button" class="btn" id="m-again" data-i18n="m_again"></button>
      </div>
      <p class="voice-note" id="m-speak-note" hidden></p>
    </section>
  </div>

  <p class="foot" data-i18n="footer"></p>
</main>

<script>
(() => {
  "use strict";

  /* ================= text (English and Tamil) ================= */
  const UI = {
    en: {
      tagline: "Check an Android app before you install it",
      privacy: "Your file is read inside this browser and is never uploaded. The app is not installed or run.",
      drop_title: "Choose an APK file", drop_hint: "or drop it here. Up to 1 GB.",
      samples_label: "No APK to hand? Try an example",
      sample_rto: "Fake RTO challan app", sample_sms: "SMS backup tool", sample_notes: "Notes app",
      example_chip: "Example data, not a real file",
      reading: "Reading the app...", score: "Risk score", why: "Why we say this", no_reasons: "No warning signs found.",
      help_title: "If you installed it or lost money",
      help_body: "Uninstall the app and call the national cybercrime helpline right away. You can also report online.",
      helpline: "Helpline 1930",
      tech: "Technical details", app_name: "App name", package: "Package name", version: "Version",
      signer: "Signed by", cert: "Signing certificate (SHA-256)", schemes: "Signature types found", perms: "Permissions requested",
      none: "None", unknown: "Unknown", scheme_note: "The signature is read here but not verified.",

    tl.textContent = "";
    if (!res.threats.length) tl.append(el("li", "threat", t("th_none")));
    for (const th of res.threats) {
      const def = THREATS[th.id], li = el("li", "threat");
      const head = el("div", "threat-head");
      head.append(el("b", "", pick(def.name)), el("span", "sev " + severity(th.points), th.points + " / 100 " + t("th_points")));
      li.append(head, el("span", "lbl", t("th_effect")), el("p", "", pick(def.effect)));
      if (def.like) li.append(el("span", "like", t("th_like") + ": " + def.like));
      tl.append(li);
    }
    $("help").hidden = res.level !== "HIGH";
    $("second").hidden = !info.fileHash;
    if (info.fileHash) $("vt").href = "https://www.virustotal.com/gui/file/" + info.fileHash.toLowerCase();

    const dl = $("tech");
    dl.textContent = "";
    const row = (label, node) => { const d = document.createElement("div"); d.append(el("dt", "", label)); const dd = el("dd"); dd.append(node); d.append(dd); dl.append(d); };
    const text = (s) => document.createTextNode(s || t("unknown"));
    const list = (items) => { if (!items.length) return text(t("none")); const u = el("ul", "perms"); items.forEach((i) => u.append(el("li", "", i))); return u; };
    row(t("app_name"), text(info.label));
    row(t("package"), text(info.package));
    row(t("version"), text(info.version));
    if (info.targetSdk) row(t("target_sdk"), text(String(info.targetSdk)));
    if (typeof info.launcher === "boolean") row(t("home_icon"), text(t(info.launcher ? "icon_yes" : "icon_no")));
    row(t("signer"), list(info.subjects.map((s) => [s.cn, s.org].filter(Boolean).join(", ") || t("unknown"))));
    row(t("cert"), list(info.fingerprints.map(colonHex)));
    if (info.sha1 && info.sha1.length) row(t("cert1"), list(info.sha1.map(colonHex)));
    const sch = el("span"); sch.append(info.schemes.length ? info.schemes.join(", ") : t("none")); sch.append(el("div", "note", t("scheme_note")));
    row(t("schemes"), sch);
    if (info.fileHash) row(t("file_hash"), text(colonHex(info.fileHash)));
    if (typeof info.codeFiles === "number") row(t("code_files"), text(String(info.codeFiles)));
    row(t("perms"), list(info.permissions));

    $("fallback-wrap").hidden = true;
    $("copy").textContent = t("copy");
    syncAlert();
    if (focus) {
      const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      $("verdict").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
      $("verdict-text").focus({ preventScroll: true });
    }
  }

  function resultText() {
    const { info, res } = current;
    return [`APK Shield: ${pick(VERDICT[res.level])} (${res.score}/100)`, `${info.label} (${info.package})`, ...res.threats.map((x) => `- ${pick(THREATS[x.id].name)}: ${x.points}/100`), ...res.reasons.slice(0, 4).map((r) => "- " + fill(REASON[r.key], r.params)), t("disc_body")].join("\n");
  }

  function renderMsgResult(focus) {
    const { res, example } = curMsg;
    $("msg-result").hidden = false;
    $("m-example-chip").hidden = !example;
    $("m-verdict").className = "verdict " + res.level.toLowerCase();
    $("m-verdict-icon").innerHTML = ICON[res.level];
    $("m-verdict-text").textContent = pick(MVERDICT[res.level]);
    $("m-score").textContent = String(res.score);
    $("m-meter").style.width = Math.max(3, res.score) + "%";
    $("m-summary").textContent = pick(MSUMMARY[res.level]);
    const ul = $("m-reasons");
    ul.textContent = "";
    if (!res.reasons.length) ul.append(el("li", "", t("no_reasons")));
    for (const r of res.reasons) {
      const li = document.createElement("li"), sev = severity(r.weight);
      li.append(el("span", "sev " + sev, t("sev_" + sev)), el("span", "", fill(MREASON[r.key], r.params)));
      ul.append(li);
    }
    const ll = $("m-links");
    ll.textContent = "";
    if (!res.links.length) ll.append(el("li", "linkrow", t("links_none")));
    for (const l of res.links) {
      const li = el("li", "linkrow"), tags = el("div", "tags");
      const tag = (k, cls) => tags.append(el("span", "sev " + cls, t(k)));
      if (l.official) tag("tag_official", "low");
      if (l.apk) tag("tag_apk", "high");
      if (l.fake) tag("tag_fake", "high");
      if (l.tricky) tag("tag_tricky", "high");
      if (l.shortener) tag("tag_short", "medium");
      if (l.badTld) tag("tag_tld", "medium");
      if (!tags.children.length) tag("tag_unknown", "medium");
      li.append(el("code", "", l.raw), tags);
      ll.append(li);
    }
    $("m-help").hidden = res.level !== "HIGH";
    syncAlert();
    if (focus) {
      const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
      $("m-verdict").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
      $("m-verdict-text").focus({ preventScroll: true });
    }
  }
  function runMessageCheck(text, example) {
    const box = $("msg-status");
    if (!text.trim()) { box.textContent = t("msg_empty"); box.hidden = false; return; }
    box.hidden = true;
    stopSpeech();
    curMsg = { res: analyzeMessage(text), example: !!example };
    renderMsgResult(true);
  }

  async function handleFile(file) {
    if (!file) return;
    errorCode = null; statusKey = "reading"; renderStatus(); setBusy(true);
    $("file-name").textContent = file.name;
    try {
      const info = await analyzeFile(file, (pct) => { if (file.size > 32 * MB) $("status").textContent = t("progress") + " " + pct + "%"; });
      current = { info, res: assess(info), example: false };
      statusKey = null; renderStatus(); renderResult(true);
    } catch (err) {
      statusKey = null;
      errorCode = err instanceof AppError && ERR[err.code] ? err.code : "analysis_failed";
      renderStatus();
    } finally { setBusy(false); $("file").value = ""; }
  }

  /* ================= wiring ================= */
  $("lang-en").addEventListener("click", () => { lang = "en"; try { localStorage.setItem("apkshield_lang", lang); } catch (e) { /* ignore */ } renderStatic(); });
  $("lang-ta").addEventListener("click", () => { lang = "ta"; try { localStorage.setItem("apkshield_lang", lang); } catch (e) { /* ignore */ } renderStatic(); });
  $("file").addEventListener("change", (e) => handleFile(e.target.files[0]));
  document.querySelectorAll(".chip[data-sample]").forEach((b) => b.addEventListener("click", () => {
    errorCode = null; statusKey = null; renderStatus();
    const info = EXAMPLES[b.dataset.sample];
    current = { info, res: assess(info), example: true };
    renderResult(true);
  }));
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((n) => drop.addEventListener(n, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => handleFile(e.dataTransfer.files[0]));
  $("tab-apk").addEventListener("click", () => setTab("apk"));
  $("tab-msg").addEventListener("click", () => setTab("msg"));
  $("speak").addEventListener("click", speak);
  $("m-speak").addEventListener("click", speak);
  $("msg-check").addEventListener("click", () => runMessageCheck($("msg-input").value, false));
  $("msg-clear").addEventListener("click", () => { $("msg-input").value = ""; $("msg-status").hidden = true; curMsg = null; $("msg-result").hidden = true; stopSpeech(); syncAlert(); $("msg-input").focus(); });
  $("m-again").addEventListener("click", () => { $("msg-input").value = ""; curMsg = null; $("msg-result").hidden = true; stopSpeech(); syncAlert(); window.scrollTo({ top: 0 }); $("msg-input").focus(); });
  document.querySelectorAll("[data-msample]").forEach((b) => b.addEventListener("click", () => { const txt = MSG_SAMPLES[b.dataset.msample]; $("msg-input").value = txt; runMessageCheck(txt, true); }));
  $("again").addEventListener("click", () => {
    stopSpeech();
    current = null; $("result").hidden = true; errorCode = null; statusKey = null; renderStatus(); syncAlert();
    window.scrollTo({ top: 0 }); $("file").focus();
  });
  $("copy").addEventListener("click", async () => {
    const text = resultText();
    try { await navigator.clipboard.writeText(text); $("copy").textContent = t("copied"); setTimeout(() => { if (current) $("copy").textContent = t("copy"); }, 1800); }
    catch (err) { const box = $("fallback"); box.value = text; $("fallback-wrap").hidden = false; box.focus(); box.select(); }
  });

  renderStatic();
})();
</script>
</body>
</html>
